spring.application.name=ras-safety-form
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ras_safety_form}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sl@yQgirlb0ss}

# The schema is managed by sql/schema.sql, never by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

server.port=${PORT:8080}

# Server sessions remain valid for 30 days of inactivity, and the browser cookie
# persists for 30 days so closing the browser does not sign the user out.
# Set SESSION_COOKIE_SECURE=true in production when the app is served over HTTPS.
server.servlet.session.timeout=30d
spring.session.jdbc.initialize-schema=never
app.session.cookie-secure=${SESSION_COOKIE_SECURE:false}

supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET}
supabase.signed-url-ttl=15m

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
