spring.application.name=ras-safety-form
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database credentials come from the environment (or the git-ignored .env file).
# There is intentionally no default password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ras_safety_form}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# The schema is managed by the Flyway migrations in db/migration, never by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true
# Databases created from the original sql/schema.sql are baselined at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Zone the legacy naive timestamps were written in, used once by V2.
spring.flyway.placeholders.legacy_timezone=${LEGACY_DATA_TIMEZONE:UTC}

server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the hosting platform's proxy (needed for the
# client IP used by login rate limiting). Set to none when not behind a proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Server sessions remain valid for 30 days of inactivity, and the browser cookie
# persists for 30 days so closing the browser does not sign the user out.
server.servlet.session.timeout=30d
spring.session.jdbc.initialize-schema=never
# Cookie flags. Use the "prod" profile (SPRING_PROFILES_ACTIVE=prod) for HTTPS deployments.
app.session.cookie-secure=${SESSION_COOKIE_SECURE:false}
app.session.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}

# Comma-separated browser origins allowed to call the API from another site.
# Leave empty when the frontend is served by this application (same origin).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.hsts-enabled=${HSTS_ENABLED:false}

# Failed login attempts allowed per client+username (and per client) in the window.
app.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:15m}

supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET}
supabase.signed-url-ttl=15m

# Five 10 MB photos plus the JSON part and multipart boundaries.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
server.tomcat.max-swallow-size=64MB

# Static files and the SPA fallback are registered explicitly in WebConfig.
spring.web.resources.add-mappings=false
